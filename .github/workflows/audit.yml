name: Lighthouse Audit Runner

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Mantiscan Site ID'
        required: true
        type: string
      url:
        description: 'Target Website URL to Audit'
        required: true
        type: string
      name:
        description: 'Site Name'
        required: false
        default: 'Website'
        type: string
      callback_url:
        description: 'Cloudflare API Ingestion Webhook URL'
        required: true
        type: string
      ingest_secret:
        description: 'Ingestion Secret for Authentication'
        required: true
        type: string

  schedule:
    # Fallback weekly trigger: runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

concurrency:
  group: audit-${{ inputs.site_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  audit:
    name: Run Lighthouse CI Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Lighthouse CI CLI
        run: npm install -g @lhci/cli@0.14.0 --no-audit --no-fund

      - name: Verify Google Chrome Stable
        run: |
          google-chrome --version || { echo "Google Chrome binary missing!"; exit 1; }

      - name: Run Lighthouse CI (Mobile - 3 Runs)
        continue-on-error: true
        run: |
          lhci collect --url="${{ inputs.url }}" --numberOfRuns=3 \
            --settings.onlyCategories=performance,accessibility,best-practices,seo \
            --settings.maxWaitForLoad=30000 \
            --settings.chromeFlags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled --disable-extensions --disable-background-networking" \
            --settings.emulatedFormFactor=mobile --additive
          lhci upload --target=temporary-public-storage || true
          rm -rf .lighthouseci-mobile && mv .lighthouseci .lighthouseci-mobile

      - name: Run Lighthouse CI (Desktop - 3 Runs)
        continue-on-error: true
        run: |
          lhci collect --url="${{ inputs.url }}" --numberOfRuns=3 \
            --settings.onlyCategories=performance,accessibility,best-practices,seo \
            --settings.maxWaitForLoad=30000 \
            --settings.chromeFlags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled --disable-extensions --disable-background-networking" \
            --settings.preset=desktop --additive
          lhci upload --target=temporary-public-storage || true
          rm -rf .lighthouseci-desktop && mv .lighthouseci .lighthouseci-desktop

      - name: Upload Lighthouse Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-${{ inputs.site_id }}-${{ github.run_id }}
          path: |
            .lighthouseci-mobile/
            .lighthouseci-desktop/
            .lighthouseci/
          retention-days: 14

      - name: Post Results to Mantiscan Cloudflare API
        if: always()
        run: |
          node scripts/post-results.js
        env:
          SITE_ID: ${{ inputs.site_id }}
          TARGET_URL: ${{ inputs.url }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          INGEST_SECRET: ${{ inputs.ingest_secret }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
