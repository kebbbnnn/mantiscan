name: Lighthouse Audit Runner

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Mantiscan Site ID'
        required: true
        type: string
      url:
        description: 'Target Website URL to Audit'
        required: true
        type: string
      name:
        description: 'Site Name'
        required: false
        default: 'Website'
        type: string
      callback_url:
        description: 'Cloudflare API Ingestion Webhook URL'
        required: true
        type: string
      ingest_secret:
        description: 'Ingestion Secret for Authentication'
        required: true
        type: string

  schedule:
    # Fallback weekly trigger: runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  audit:
    name: Run Lighthouse CI Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Ensure Google Chrome Stable
        run: |
          if ! command -v google-chrome &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Run Lighthouse CI (Mobile - 3 Runs)
        continue-on-error: true
        run: |
          npx @lhci/cli collect --url="${{ inputs.url }}" --numberOfRuns=3 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled" --settings.emulatedFormFactor=mobile --additive

      - name: Run Lighthouse CI (Desktop - 3 Runs)
        continue-on-error: true
        run: |
          npx @lhci/cli collect --url="${{ inputs.url }}" --numberOfRuns=3 --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled" --settings.preset=desktop --additive

      - name: Upload Lighthouse Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-${{ inputs.site_id }}-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30

      - name: Post Results to Mantiscan Cloudflare API
        if: always()
        run: |
          node scripts/post-results.js
        env:
          SITE_ID: ${{ inputs.site_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          INGEST_SECRET: ${{ inputs.ingest_secret }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
